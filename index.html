<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>ARおみくじ</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.7/aframe/build/aframe-ar.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    #drawButton {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;

      padding: 15px 25px;
      font-size: 18px;
      white-space: nowrap;

      background: #b22222;
      color: white;
      border: none;
      border-radius: 10px;
    }

    #drawButton:disabled {
      background: gray;
    }
  </style>
</head>

<body>

  <button id="drawButton" disabled>
    マーカーを映してください
  </button>

  <a-scene embedded
    arjs="sourceType: webcam; debugUIEnabled: false;"
    vr-mode-ui="enabled: false">

    <a-marker
  id="myMarker"
  type="pattern"
  url="pattern-marker1.patt">

  <a-entity
    position="0 0.5 0"
    rotation="-90 0 0">

    <a-text
      id="resultText"
      value="おみくじ"
      position="0 0 0"
      align="center"
      color="#FF0000"
      width="4">
    </a-text>

  </a-entity>

</a-marker>
    
  </a-scene>

  <script>

    const fortunes = [
  "大吉！",
  "中吉！",
  "小吉！",
  "吉！"
];

const resultText = document.querySelector("#resultText");
const drawButton = document.querySelector("#drawButton");
const marker = document.querySelector("#myMarker");

// マーカーを認識したとき
marker.addEventListener("markerFound", function() {
  drawButton.disabled = false;
  drawButton.textContent = "おみくじを引く";
});

// マーカーを見失ったとき
marker.addEventListener("markerLost", function() {
  drawButton.disabled = true;
  drawButton.textContent = "マーカーを映してください";
});

// ボタンを押したとき
drawButton.addEventListener("click", function() {
  const randomIndex = Math.floor(Math.random() * fortunes.length);
  const result = fortunes[randomIndex];

  resultText.setAttribute("value", result);

  console.log("結果:", result);
});
    
  </script>

</body>
</html>
